<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16794B" />
    <title>Rasionalin | Koneksi Terputus</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf9f5;
        color: #1c241e;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 400px;
        width: 100%;
        background: #ffffff;
        border: 2px solid #dfe5dc;
        border-bottom-width: 4px;
        border-radius: 20px;
        padding: 28px;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 14px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.55;
        color: #556158;
        margin: 0 0 20px;
      }
      button {
        width: 100%;
        min-height: 46px;
        border: 0;
        border-bottom: 4px solid #0f5a36;
        border-radius: 14px;
        background: #16794b;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/logo.svg" alt="Rasionalin" class="logo" />
      <h1>Kamu sedang offline</h1>
      <p>
        Sambungkan kembali internet di HP atau laptopmu untuk melanjutkan latihan dan menyinkronkan progres Rasionalin.
      </p>
      <button type="button" onclick="window.location.reload()">Coba Muat Ulang</button>
    </main>
  </body>
</html>
