services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kejarsnbt-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_dev
      POSTGRES_DB: kejarsnbt
    ports:
      - "54322:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kejarsnbt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data:
